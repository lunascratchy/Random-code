# Routes for the map you are navigating on (map frame, metres, same numbers RViz shows).
# Launch with  route:=1 | 2 | 3  to pick one. The robot drives from `start` through every point of
# that route in order, without stopping at the intermediate ones, and ends at the last point.
#
# start:   where the robot is parked at launch. The runner gives AMCL this pose before moving.
#          (0, 0, 0) is right IF you park exactly where you started mapping, facing the same way.
# route_N: ordered points to drive through. Space them >= 1 m apart (Nav2 drops a via-point that is
#          within 0.7 m of the robot). yaw = heading in radians (0 = along +x); final yaw is ignored.
#
# Get coordinates: RViz "Publish Point" tool (toolbar "+"), click a spot, then
#   ros2 topic echo /auracle/clicked_point
# Do NOT use 2D Goal Pose for this: with Nav2 running it sends the robot there.
#
# All routes are empty on purpose: a route refuses to run until you fill it in.
start: {x: 0.0, y: 0.0, yaw: 0.0}
route_1: []
route_2: []
route_3: []
# Shape of a filled one:
# route_1:
#   - {x: 1.20, y: 0.40, yaw: 0.0}
#   - {x: 2.40, y: 0.40, yaw: 0.0}
#   - {x: 3.60, y: 0.60, yaw: 0.0}