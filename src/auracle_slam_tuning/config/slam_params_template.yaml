# Copy of auracle_bringup/config/mapper_params_online_async.yaml with the
# handful of params Optuna is searching over replaced by {placeholders}.
# run_trial.py renders this with str.format(**params) into a temp file
# and passes it as online_async_launch.py's params_file:= argument.
#
# Everything NOT a placeholder here should stay in sync with your real
# mapper_params_online_async.yaml - if you hand-tune something there,
# copy the change here too, or this template will silently fight it.
slam_toolbox:
  ros__parameters:

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.4
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: {minimum_travel_distance}
    minimum_travel_heading: {minimum_travel_heading}
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: {link_match_minimum_response_fine}
    link_scan_maximum_distance: 0.5

    loop_search_maximum_distance: {loop_search_maximum_distance}
    do_loop_closing: true
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: {loop_match_minimum_response_coarse}
    loop_match_minimum_response_fine: {loop_match_minimum_response_fine}

    correlation_search_space_dimension: {correlation_search_space_dimension}
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: {distance_variance_penalty}
    angle_variance_penalty: {angle_variance_penalty}

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
