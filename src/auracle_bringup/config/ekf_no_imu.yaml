# Layered on top of ekf.yaml by launch_robot.launch.py when use_imu:=false.
# An all-false imu0_config makes robot_localization ignore the IMU topic,
# and yaw rate comes from wheel odometry instead. Expect more heading
# drift than with the MPU6050 - SLAM's scan matching has to do more work.
ekf_filter_node:
    ros__parameters:
        odom0_config: [false, false, false,
                       false, false, false,
                       true,  false, false,
                       false, false, true,
                       false, false, false]
        imu0_config: [false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, false]
