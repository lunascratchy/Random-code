; auracle_firmware - Arduino Nano V3.0 (ATmega328P) firmware
; Opens cleanly in BOTH toolchains from the same files:
;   PlatformIO : open this folder (the one with this platformio.ini). `pio run` / `pio run -t upload` just works because of the src_dir override below.
;   Arduino IDE: File > Open > firmware/auracle_firmware/auracle_firmware.ino. That inner folder is named exactly like the .ino file. (Arduino's hard requirement for a valid sketch), and every .cpp/.h file the sketch needs sits flat alongside it, so the IDE compiles them all automatically - just install the 3 libraries listed below via Sketch > Include Library > Manage Libraries.

[platformio]
src_dir = auracle_firmware

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino

monitor_speed = 115200

; --- Upload port ---
; The Nano's FTDI FT232 (0403:6001) shows up as /dev/ttyUSB0 on both
; WSL (after `usbipd attach`) and the Pi. With the udev rule from
; auracle_bringup/config/99-auracle.rules installed it's /dev/arduino.
; upload_port = /dev/ttyUSB0