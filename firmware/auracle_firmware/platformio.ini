[env:auracle_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

; --- Communication Settings ---
; Match this to the BAUDRATE in your config.h and ros2_control.xacro
monitor_speed = 115200

; --- Library Dependencies ---
; PlatformIO will automatically download and manage these
lib_deps = 
    # MPU6050 Driver
    adafruit/Adafruit MPU6050 @ ^2.2.4
    # Required dependency for Adafruit MPU6050
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    # For I2C communication
    Wire

; --- Build Flags ---
; You can define global constants here if you want to keep them out of config.h
build_flags = 
    -D DEBUG_MODE=1

; --- Upload Settings ---
; If you have issues uploading to a Nano clone, try changing the board 
; to 'nanoatmega328new' or adding the following line if you use a specific port:
; upload_port = /dev/ttyUSB0