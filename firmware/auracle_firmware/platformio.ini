; auracle_firmware - Arduino Nano V3.0 (ATmega328P) firmware
;
;
; Opens cleanly in BOTH toolchains from the same files:
;   PlatformIO : open this folder (the one with this platformio.ini).
;                `pio run` / `pio run -t upload` just works because of
;                the src_dir override below.
;   Arduino IDE: File > Open > firmware/auracle_firmware/auracle_firmware.ino
;                That inner folder is named exactly like the .ino file
;                (Arduino's hard requirement for a valid sketch), and
;                every .cpp/.h file the sketch needs sits flat alongside
;                it, so the IDE compiles them all automatically - just
;                install the 3 libraries listed below via
;                Sketch > Include Library > Manage Libraries.

[platformio]
src_dir = auracle_firmware

[env:nano]
platform = atmelavr
; Classic (non-"new") Nano bootloader. If uploading fails with a sync/
; timeout error, your board (if not nanoatmega328) likely has the newer bootloader - switch to
; `board = nanoatmega328new` instead.
board = nanoatmega328new
framework = arduino

; --- Communication ---
; Must match BAUDRATE in config.h and the "baud_rate" hardware param in
; your ros2_control xacro / auracle_hardware package.
monitor_speed = 115200

; --- Library dependencies ---
; Arduino IDE users: install these same 3 via Library Manager.


; --- Upload settings ---
; If uploading to a Nano clone (CH340 USB chip) fails, uncomment and set
; the correct port:
; upload_port = /dev/ttyUSB0
